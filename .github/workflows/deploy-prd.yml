name: Deploy to NetBox Production

on:
    push:
        branches:
            - stack-transit-prd

jobs:
    deploy-prd:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code (code-main)
              uses: actions/checkout@v4
              with:
                  ref: code-main

            - name: Checkout Stack Config (stack-transit-prd)
              uses: actions/checkout@v4
              with:
                  ref: stack-transit-prd
                  token: ${{ secrets.GITHUB_TOKEN }}
                  path: temp-stack

            - name: Merge Stack Files into Workspace
              run: |
                  # Copy Pulumi stack configuration files into the root project directory
                  cp temp-stack/Pulumi.prd.yaml ./ || true

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run Pulumi Up (Prod)
              uses: pulumi/actions@v5
              with:
                  command: up
                  stack_name: prd
              env:
                  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
                  NETBOX_SERVER_URL: https://bcdg8981.cloud.netboxapp.com
                  NETBOX_API_TOKEN: ${{ secrets.PRD_NETBOX_TOKEN }}

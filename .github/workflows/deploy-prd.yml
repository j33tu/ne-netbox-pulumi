- name: Run Pulumi Up (Prod)
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: prd  # Uses kebab-case
          cloud-url: azblob://netbox-pulumi-state  # REPLACE with your actual Azure Blob container name
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          NETBOX_SERVER_URL: https://bcdg8981.cloud.netboxapp.com
          NETBOX_PROD_TOKEN: ${{ secrets.NETBOX_PROD_TOKEN }}
          NETBOX_ALLOW_UNSUPPORTED_VERSION: "true"

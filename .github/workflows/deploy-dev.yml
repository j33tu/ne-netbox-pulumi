name: Deploy Dev NetBox Infrastructure

on:
  push:
    branches:
      - stack-transit-dev
    paths:
      - 'Pulumi.dev.yaml'
      - 'Pulumi.yaml'
      - 'inputs/**'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  deploy-dev:
    name: Pulumi Preview & Deploy (Dev)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Python infrastructure code base from code-dev
      - name: Checkout Code Base (code-dev)
        uses: actions/checkout@v4
        with:
          ref: code-dev

      # Step 2: Checkout stack configuration to a temporary directory
      - name: Checkout Stack Configuration (stack-transit-dev)
        uses: actions/checkout@v4
        with:
          ref: stack-transit-dev
          path: temp-stack

      # Step 3: Overlay stack files on top of code files
      - name: Overlay Stack Configuration
        run: |
          cp -f temp-stack/Pulumi.dev.yaml ./
          cp -f temp-stack/Pulumi.yaml ./ 2>/dev/null || true
          if [ -d "temp-stack/inputs" ]; then cp -rf temp-stack/inputs ./; fi
          rm -rf temp-stack

      # Step 4: Setup Python environment
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 5: Setup Pulumi CLI
      - name: Setup Pulumi CLI
        uses: pulumi/actions@v5

      # Step 6: Generate the NetBox provider SDK (Terraform-bridged, e-breuninger)
      # This downloads the provider plugin and writes the SDK to ./sdks/netbox
      # plus registers it in Pulumi.yaml. It does NOT install it into Python
      # or touch requirements.txt — that's handled in the next step.
      - name: Add NetBox Provider SDK
        run: pulumi package add terraform-provider e-breuninger/netbox

      # Step 7: Wire the local SDK into requirements.txt
      # Remove any stale reference to the old abandoned PyPI package,
      # then point requirements.txt at the freshly generated local SDK.
      - name: Link Local NetBox SDK into requirements.txt
        run: |
          sed -i '/^pulumi[-_]netbox/d' requirements.txt || true
          echo "sdks/netbox" >> requirements.txt
          cat requirements.txt

      # Step 8: Install dependencies using pre-built wheels
      - name: Install Dependencies
        run: |
          # 1. Upgrade build tools
          python -m pip install --upgrade pip setuptools wheel

          # 2. Setup venv and upgrade build tools inside venv
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip setuptools wheel

          # 3. Pre-install dependencies with binary preference
          PULUMI_SKIP_UPDATE_CHECK=true pip install --prefer-binary -r requirements.txt
          PULUMI_SKIP_UPDATE_CHECK=true ./venv/bin/pip install --prefer-binary -r requirements.txt

          # 4. Export virtual environment paths
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH
          echo "PYTHONPATH=.:$SITE_PACKAGES:$GITHUB_WORKSPACE/venv/lib/python3.11/site-packages" >> $GITHUB_ENV

      # Step 9: Auto-create container if missing
      - name: Create Azure Container if Missing
        run: |
          az storage container create \
            --name stpulumistatedev1 \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --account-key "$AZURE_STORAGE_KEY" \
            --output none
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      # Step 10: Authenticate to Azure Blob State Backend
      - name: Login to Azure Blob State Backend
        run: pulumi login azblob://stpulumistatedev1
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      # Step 11: Select or create the dev stack with passphrase
      - name: Select or Create Dev Stack
        run: pulumi stack select dev || pulumi stack init dev
        env:
          PULUMI_BACKEND_URL: 'azblob://stpulumistatedev1'
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      # Step 12: Run Pulumi Preview
      - name: Pulumi Preview
        run: pulumi preview --stack dev --non-interactive
        env:
          PULUMI_BACKEND_URL: 'azblob://stpulumistatedev1'
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          NETBOX_DEV_TOKEN: ${{ secrets.NETBOX_DEV_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      # Step 13: Apply changes to NetBox
      - name: Pulumi Deploy
        run: pulumi up --stack dev --yes --non-interactive
        env:
          PULUMI_BACKEND_URL: 'azblob://stpulumistatedev1'
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          NETBOX_DEV_TOKEN: ${{ secrets.NETBOX_DEV_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

name: Deploy Dev NetBox Infrastructure

on:
  push:
    branches:
      - code-dev

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Pulumi Up
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
        env:
          NETBOX_DEV_TOKEN: ${{ secrets.NETBOX_DEV_TOKEN }}
          # PULUMI_BACKEND_URL: 's3://your-state-bucket' # If using self-hosted state

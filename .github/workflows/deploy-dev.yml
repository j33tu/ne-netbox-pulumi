name: Deploy to NetBox Dev

on:
    push:
        branches:
            - stack-transit-dev

jobs:
    deploy-dev:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code (code-dev)
              uses: actions/checkout@v4
              with:
                  ref: code-dev

            - name: Checkout Stack Config (stack-transit-dev)
              uses: actions/checkout@v4
              with:
                  ref: stack-transit-dev
                  token: ${{ secrets.GITHUB_TOKEN }}
                  path: temp-stack

            - name: Merge Stack Files into Workspace
              run: |
                  # Copy Pulumi stack configuration files into the root project directory
                  cp temp-stack/Pulumi.dev.yaml ./ || true

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run Pulumi Up (Dev)
              uses: pulumi/actions@v5
              with:
                  command: up
                  stack_name: dev
              env:
                  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
                  NETBOX_SERVER_URL: https://myas9346.cloud.netboxapp.com
                  NETBOX_API_TOKEN: ${{ secrets.DEV_NETBOX_TOKEN }}

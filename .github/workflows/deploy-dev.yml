name: Deploy Dev NetBox Infrastructure

on:
  push:
    branches:
      - stack-transit-dev
    paths:
      - 'Pulumi.dev.yaml'
      - 'Pulumi.yaml'
      - 'inputs/**'

jobs:
  deploy-dev:
    name: Pulumi Preview & Deploy (Dev)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Python infrastructure code from code-dev
      - name: Checkout Code Base (code-dev)
        uses: actions/checkout@v4
        with:
          ref: code-dev

      # Step 2: Overlay stack files from stack-transit-dev
      - name: Checkout Stack Configuration (stack-transit-dev)
        uses: actions/checkout@v4
        with:
          ref: stack-transit-dev
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Pulumi CLI
        uses: pulumi/actions@v5

      - name: Login to Azure Blob State Backend
        run: pulumi login azblob://pulumistate
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      - name: Select or Create Dev Stack
        run: pulumi stack select dev || pulumi stack init dev
        env:
          PULUMI_BACKEND_URL: 'azblob://pulumistate'
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      # Step 3: Run Pulumi Preview
      - name: Pulumi Preview
        uses: pulumi/actions@v5
        with:
          command: preview
          stack-name: dev
        env:
          PULUMI_BACKEND_URL: 'azblob://pulumistate'
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          NETBOX_DEV_TOKEN: ${{ secrets.NETBOX_DEV_TOKEN }}

      # Step 4: Apply changes to NetBox
      - name: Pulumi Deploy
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
        env:
          PULUMI_BACKEND_URL: 'azblob://pulumistate'
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          NETBOX_DEV_TOKEN: ${{ secrets.NETBOX_DEV_TOKEN }}

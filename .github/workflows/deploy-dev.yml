name: Deploy Dev NetBox Infrastructure

on:
  push:
    branches:
      - code-dev

jobs:
  deploy-dev:
    name: Pulumi Deploy (Dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Pulumi CLI
        uses: pulumi/actions@v5

      - name: Login to Azure Blob State Backend
        run: pulumi login azblob://pulumistate
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      - name: Select or Create Dev Stack
        run: pulumi stack select dev || pulumi stack init dev
        env:
          PULUMI_BACKEND_URL: 'azblob://pulumistate'
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      - name: Pulumi Up
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
          yes: true
        env:
          PULUMI_BACKEND_URL: 'azblob://pulumistate'
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          NETBOX_DEV_TOKEN: ${{ secrets.NETBOX_DEV_TOKEN }}
